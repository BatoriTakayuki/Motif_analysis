services:
  motif-analysis:
    build: .
    image: motif-analysis
    container_name: motif-analysis
    init: true
    restart: unless-stopped
    ports:
      - "${MOTIF_HOST_IP:-10.40.3.211}:8765:8765"
    volumes:
      - ./genome_cache:/data/genomes
    command:
      - python
      - server.py
      - --host
      - 0.0.0.0
      - --allowed-host
      - "${MOTIF_HOST_IP:-10.40.3.211}"
      - --genome-cache
      - /data/genomes
